name: Verify Pass 1
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - run: .venv/bin/python -m pytest -q
      - run: .venv/bin/python -m scripts.solver_smoke
      - run: npm ci
        working-directory: frontend
      - run: .venv/bin/python -m scripts.export_contracts
      - run: npm run generate:types && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/contracts.generated.ts
      - run: npm run test:e2e
        working-directory: frontend
      - run: docker build -t planning-pass1 .
      - run: docker run -d --name planning-pass1 -p 8000:8000 planning-pass1
      - run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          .venv/bin/python -m scripts.smoke
          docker exec planning-pass1 python scripts/solver_smoke.py
