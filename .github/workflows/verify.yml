name: Verify planning MVP
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: python -m venv .venv && .venv/bin/pip install -r requirements-dev.txt
      - name: Run backend tests
        run: .venv/bin/python -m pytest -q
      - name: Run host solver smoke
        run: .venv/bin/python -m scripts.solver_smoke
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Export API contracts
        run: .venv/bin/python -m scripts.export_contracts
      - name: Generate frontend types and build
        run: npm run generate:types && npm run build
        working-directory: frontend
      - name: Verify production static delivery
        run: npm --prefix frontend run build:vercel && .venv/bin/python -m pytest -q backend/tests/test_static_delivery.py
      - name: Verify generated contracts are committed
        run: git diff --exit-code -- frontend/src/contracts.generated.ts
      - name: Build and inspect actual Vercel output (no account access)
        env:
          VERCEL_TELEMETRY_DISABLED: '1'
          VERCEL_FASTAPI_STATIC_CDN: '1'
        run: |
          .venv/bin/pip install uv==0.12.19
          .venv/bin/python -m scripts.vercel_output_check --prepare
          PATH="$PWD/.venv/bin:$PATH" npm exec --yes --package=vercel@60.0.1 -- vercel build --global-config "$PWD/.vercel/empty-auth"
          .venv/bin/python -m scripts.vercel_output_check --evidence artifacts/vercel-output.json
      - name: Retain Vercel routing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: vercel-static-output-${{ github.sha }}
          include-hidden-files: true
          path: |
            artifacts/vercel-output.json
            .vercel/output/config.json
            .vercel/output/builds.json
          if-no-files-found: error
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Run browser tests
        run: npm run test:e2e
        working-directory: frontend
      - name: Build Docker image
        run: docker build -t planning-pass1 .
      - name: Start Docker application
        run: docker run -d --name planning-pass1 -p 8000:8000 planning-pass1
      - name: Verify Docker health (required by all container smokes)
        id: docker_health
        run: |
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8000/api/health
      - name: Run production forecast smoke
        if: ${{ !cancelled() && steps.docker_health.outcome == 'success' }}
        run: .venv/bin/python -m scripts.smoke
      - name: Verify Docker homepage assets and API routing
        if: ${{ !cancelled() && steps.docker_health.outcome == 'success' }}
        run: .venv/bin/python -m scripts.static_delivery_smoke --url http://127.0.0.1:8000 --local
      - name: Run solver smoke inside container
        if: ${{ !cancelled() && steps.docker_health.outcome == 'success' }}
        run: docker exec planning-pass1 python scripts/solver_smoke.py
      - name: Run production planning smoke
        id: planning_smoke
        if: ${{ !cancelled() && steps.docker_health.outcome == 'success' }}
        run: .venv/bin/python -m scripts.planning_smoke
      - name: Verify compact planning and authoritative lazy evidence
        if: ${{ !cancelled() && steps.docker_health.outcome == 'success' }}
        run: .venv/bin/python -m scripts.planning_transport_smoke
      - name: Run production scenario smoke
        id: scenario_smoke
        if: ${{ !cancelled() && steps.docker_health.outcome == 'success' }}
        run: .venv/bin/python -m scripts.scenario_smoke
      - name: Profile planning components inside container
        if: ${{ !cancelled() && steps.docker_health.outcome == 'success' }}
        run: docker exec planning-pass1 python -m scripts.planning_profile
      - name: Run production upload review acceptance and export smoke
        if: ${{ !cancelled() && steps.docker_health.outcome == 'success' }}
        run: .venv/bin/python -m scripts.workflow_smoke
