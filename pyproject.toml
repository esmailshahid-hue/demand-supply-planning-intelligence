[project]
name = "demand-supply-planning-intelligence"
version = "0.1.0"
requires-python = ">=3.14"
# Keep these runtime pins identical to requirements.txt (local/Docker); tested.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn==0.53.0",
  "pydantic==2.13.5",
  "scipy==1.18.1",
  "numpy==2.5.3",
  "starlette==1.6.0",
  "anyio==4.15.1",
  "annotated-doc==0.0.5",
  "annotated-types==0.8.0",
  "click==8.5.0",
  "h11==0.16.0",
  "idna==3.19",
  "pydantic_core==2.46.5",
  "typing-inspection==0.4.4",
  "typing_extensions==4.16.0",
  "openpyxl==3.1.5",
  "et_xmlfile==2.0.0",
  "defusedxml==0.7.1"
]

[tool.vercel.fastapi.static]
# The frontend is public. API/body-limit/timing middleware remains on the function.
cdn = true
